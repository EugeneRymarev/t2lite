# Проверочная сборка: при каждом изменении кода собирает отладочный APK,
# чтобы сразу было видно, если что-то сломалось. Готовый файл лежит в разделе Actions → запуск → Artifacts.
# Ключ подписи здесь не нужен.
name: Сборка

on:
  push:
    branches: [main, master]
    paths-ignore: ['README.md', 'PROGRESS.md']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Скачать код
        uses: actions/checkout@v5

      - name: Установить Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Подготовить Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Собрать отладочный APK
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug

      - name: Сохранить APK
        uses: actions/upload-artifact@v5
        with:
          name: t2lite-debug-${{ github.sha }}
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14
